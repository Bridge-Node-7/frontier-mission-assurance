name: V&V CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fma-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-python:
    name: Python ${{ matrix.python-version }} / Ubuntu
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install bounded validation toolchain
        run: python -m pip install -r requirements-dev.txt
      - name: Install FMA source
        run: python -m pip install --no-deps -e .
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit, regression, schema, tamper, and boundary tests
        run: pytest
      - name: Public-release OPSEC scan
        run: python scripts/opsec_scan.py .
      - name: Validate public example graph
        run: fma validate examples/frontier_program/graph.yaml
      - name: List unresolved assumptions without automated priority
        run: fma assumptions examples/frontier_program/graph.yaml
      - name: Verify research receipt
        run: fma receipt examples/research_receipt/receipt.yaml
      - name: Reproduce trusted synthetic example
        run: fma reproduce examples/research_receipt/receipt.yaml --timeout 30
      - name: Verify decision receipt
        run: fma decision examples/frontier_program/graph.yaml examples/frontier_program/decision-receipt.yaml
      - name: Run bounded public-reference evaluation
        run: python scripts/evaluate_public_reference.py
      - name: Record public-safe environment fingerprint
        run: python scripts/environment_fingerprint.py --out build/environment-fingerprint.json
      - name: Upload validation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-artifacts-py${{ matrix.python-version }}
          path: |
            build/assurance-report.md
            build/environment-fingerprint.json
          if-no-files-found: error
          retention-days: 7

  cross-platform-smoke:
    name: Smoke / ${{ matrix.os }} / Python 3.12
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: pytest
      - run: fma validate examples/frontier_program/graph.yaml
      - run: fma receipt examples/research_receipt/receipt.yaml
      - run: fma reproduce examples/research_receipt/receipt.yaml --timeout 30

  package-smoke:
    name: Wheel build + fresh install
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build==1.6.1
      - run: python -m build
      - run: python -m venv .package-smoke
      - run: .package-smoke/bin/python -m pip install dist/*.whl
      - run: .package-smoke/bin/python -m pip check
      - run: .package-smoke/bin/fma validate examples/frontier_program/graph.yaml
      - run: .package-smoke/bin/fma receipt examples/research_receipt/receipt.yaml
