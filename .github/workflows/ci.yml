name: V&V CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fma-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-python:
    name: Python ${{ matrix.python-version }} / Ubuntu
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Dependency vulnerability review
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: false
      - name: Initialize CodeQL
        if: github.event_name == 'push' && matrix.python-version == '3.12'
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: python
      - name: Install bounded validation toolchain
        run: python -m pip install -r requirements-dev.txt
      - name: Install FMA source
        run: python -m pip install --no-deps -e .
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit, regression, schema, tamper, and boundary tests
        run: pytest
      - name: Public release boundary check
        run: python scripts/public_boundary_scan.py .
      - name: Validate public example graph
        run: fma validate examples/frontier_program/graph.yaml
      - name: List unresolved assumptions without automated priority
        run: fma assumptions examples/frontier_program/graph.yaml
      - name: Verify research receipt
        run: fma receipt examples/research_receipt/receipt.yaml
      - name: Reproduce trusted synthetic example
        run: fma reproduce examples/research_receipt/receipt.yaml --timeout 30
      - name: Verify decision receipt
        run: fma decision examples/frontier_program/graph.yaml examples/frontier_program/decision-receipt.yaml
      - name: Validate Scientific Discovery Assurance profile
        run: python scripts/validate_scientific_discovery.py .
      - name: Validate Orbital Recovery Assurance profile
        run: python scripts/validate_orbital_recovery_assurance.py .
      - name: Run bounded public-reference evaluation
        run: python scripts/evaluate_public_reference.py
      - name: Analyze with CodeQL
        if: github.event_name == 'push' && matrix.python-version == '3.12'
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
      - name: Record public-safe environment fingerprint
        run: python scripts/environment_fingerprint.py --out build/environment-fingerprint.json
      - name: Upload validation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-artifacts-py${{ matrix.python-version }}
          path: |
            build/assurance-report.md
            build/environment-fingerprint.json
          if-no-files-found: error
          retention-days: 7

  cross-platform-smoke:
    name: Smoke / ${{ matrix.os }} / Python 3.12
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: pytest
      - run: fma validate examples/frontier_program/graph.yaml
      - run: fma receipt examples/research_receipt/receipt.yaml
      - run: fma reproduce examples/research_receipt/receipt.yaml --timeout 30
      - run: python scripts/validate_scientific_discovery.py .
      - run: python scripts/validate_orbital_recovery_assurance.py .

  package-smoke:
    name: Wheel build + fresh install
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: >-
          python -m pip install
          "setuptools==84.0.0" "wheel==0.48.0" "build==1.6.1"
      - run: python -m build --no-isolation
      - run: python -m venv .package-smoke
      - run: .package-smoke/bin/python -m pip install dist/*.whl
      - run: .package-smoke/bin/python -m pip check
      - run: .package-smoke/bin/fma validate examples/frontier_program/graph.yaml
      - run: .package-smoke/bin/fma receipt examples/research_receipt/receipt.yaml
      - run: .package-smoke/bin/fma reproduce examples/research_receipt/receipt.yaml --timeout 30
