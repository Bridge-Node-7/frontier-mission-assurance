name: Stable Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["V&V CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stable-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare stable release
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # FMA-REL-01: listing workflow runs requires the Actions read scope.
      # Declaring permissions sets every unlisted scope to none, so this
      # must be explicit rather than relying on the repository being public.
      actions: read
    outputs:
      release_eligible: ${{ steps.identity.outputs.release_eligible }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      release_sha: ${{ steps.identity.outputs.release_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve stable release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          SHA="$RELEASE_CANDIDATE_SHA"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_eligible=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REMOTE_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$REMOTE_MAIN" != "$SHA" ]]; then
            echo "::error::Stable release must target the current remote main commit."
            exit 1
          fi
          VERIFIED="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq '.commit.verification.verified and (.commit.verification.reason == "valid")')"
          if [[ "$VERIFIED" != "true" ]]; then
            echo "::error::Stable release commit must be GitHub-verified."
            exit 1
          fi

          TAG="v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "release_eligible=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release_eligible=1" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Require successful V&V CI for the exact release commit
        # The identity step exits before exporting RELEASE_SHA when the release
        # is ineligible, so this must carry the same guard as the steps below
        # or it fails on an unbound variable under `set -u`.
        if: steps.identity.outputs.release_eligible == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # FMA-REL-01: bind publication authority to validation authority.
          # Filtered to a main-branch push run: ci.yml also runs on
          # pull_request, and a PR run at the same head SHA is not evidence
          # that the commit passed validation as it sits on protected main.
          RUNS="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&branch=main&event=push&status=success" \
            --jq '[.workflow_runs[]
                   | select(.conclusion == "success" and .head_branch == "main" and .event == "push")]
                  | length')"
          if [[ "$RUNS" -lt 1 ]]; then
            echo "::error::No successful main-push V&V CI run for $RELEASE_SHA." >&2
            exit 1
          fi
          echo "PASS: $RUNS successful main-push V&V run(s) bound to $RELEASE_SHA"

      - name: Install release toolchain
        if: steps.identity.outputs.release_eligible == '1'
        run: >-
          python -m pip install
          "setuptools==84.0.0" "wheel==0.48.0" "build==1.6.1"
          "PyYAML==6.0.3" "jsonschema==4.26.0"

      - name: Reverify release integrity
        if: steps.identity.outputs.release_eligible == '1'
        run: |
          python scripts/release_hygiene.py .
          PYTHONPATH=src python scripts/evaluate_public_reference.py
          python scripts/validate_profile_manifests.py .
          PYTHONPATH=src python -m frontier_assurance.cli validate examples/external_research_adoption/graph.yaml
          PYTHONPATH=src python -m frontier_assurance.cli decision examples/external_research_adoption/graph.yaml examples/external_research_adoption/decision-receipt.yaml
          python scripts/validate_scientific_discovery.py .
          python scripts/validate_orbital_recovery_assurance.py .
          python scripts/validate_ftqc_assurance.py .
          python scripts/evaluate_ftqc_reference.py .
          PYTHONPATH=src python scripts/validate_ftqc_case.py profiles/ftqc-assurance/examples/synthetic-neutral-atom/baseline --report build/ftqc-case-decision-basis.md
          PYTHONPATH=src python scripts/compare_ftqc_cases.py profiles/ftqc-assurance/examples/synthetic-neutral-atom/baseline profiles/ftqc-assurance/examples/synthetic-neutral-atom/changed-assumption-case --report build/ftqc-change-impact.md

      - name: Build release artifacts, SBOM, and manifests
        if: steps.identity.outputs.release_eligible == '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > "dist/FMA-v${VERSION}-SOURCE-SHA256SUMS"
          git archive --format=zip --prefix=frontier-mission-assurance/ \
            -o "dist/frontier-mission-assurance-v${VERSION}.zip" "$RELEASE_SHA"
          python -m build --wheel --no-isolation
          python scripts/generate_release_sbom.py \
            "dist/frontier_mission_assurance-${VERSION}-py3-none-any.whl" \
            "dist/FMA-v${VERSION}-SBOM.cdx.json"
          (
            cd dist
            sha256sum \
              "frontier-mission-assurance-v${VERSION}.zip" \
              "frontier_mission_assurance-${VERSION}-py3-none-any.whl" \
              "FMA-v${VERSION}-SOURCE-SHA256SUMS" \
              "FMA-v${VERSION}-SBOM.cdx.json" \
              > "FMA-v${VERSION}-SHA256SUMS"
            sha256sum -c "FMA-v${VERSION}-SHA256SUMS"
          )

      - name: Upload prepared release artifacts
        if: steps.identity.outputs.release_eligible == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fma-stable-release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish stable release
    needs: prepare
    if: needs.prepare.outputs.release_eligible == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    steps:
      - name: Require immutable-release protection before publication
        shell: bash
        run: |
          set -euo pipefail
          ENABLED="$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled')"
          if [[ "$ENABLED" != "true" ]]; then
            echo "::error::Immutable-release protection must be enabled before publishing $TAG"
            exit 1
          fi

      - name: Download prepared release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fma-stable-release-candidate
          path: dist

      - name: Verify prepared artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c "FMA-v${VERSION}-SHA256SUMS"

      - name: Attest release artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/FMA-v${{ env.VERSION }}-SHA256SUMS

      - name: Attest wheel SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/frontier_mission_assurance-${{ env.VERSION }}-py3-none-any.whl
          sbom-path: dist/FMA-v${{ env.VERSION }}-SBOM.cdx.json

      - name: Verify local artifact attestations
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "dist/frontier_mission_assurance-${VERSION}-py3-none-any.whl" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "dist/frontier-mission-assurance-v${VERSION}.zip" --repo "$GITHUB_REPOSITORY"

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG appeared after preparation; refusing to overwrite."
            exit 1
          fi

          REMOTE_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$REMOTE_MAIN" == "$RELEASE_SHA" ]]
          VERIFIED="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA" --jq '.commit.verification.verified and (.commit.verification.reason == "valid")')"
          [[ "$VERIFIED" == "true" ]]

          TAG_OBJECT_SHA="$(
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$TAG" \
              -f message="Frontier Mission Assurance $TAG" \
              -f object="$RELEASE_SHA" \
              -f type="commit" \
              --jq '.sha'
          )"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$TAG_OBJECT_SHA" \
            >/dev/null

          REF_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          REF_TYPE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type')"
          TARGET_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq '.object.sha')"
          [[ "$REF_TYPE" == "tag" ]]
          [[ "$REF_SHA" == "$TAG_OBJECT_SHA" ]]
          [[ "$TARGET_SHA" == "$RELEASE_SHA" ]]

          cat > release-notes.md <<EOF
          Frontier Mission Assurance v${VERSION} is a stable public reference release for evidence-native verification, validation, reproducibility, traceability, and mission assurance.

          This release is bound to an exact protected-main commit and includes verified source and wheel artifacts, SHA-256 manifests, a CycloneDX SBOM, and GitHub build-provenance attestations. See CHANGELOG.md for material changes.

          Release ceremony run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ github.run_id }}
          Commit: ${RELEASE_SHA}

          Verification scope: a PASS attests that the declared controls satisfied their acceptance criteria. Scientific validity, regulatory approval, safety acceptance, mission qualification, and consequential decision authority remain with the governing processes responsible for those determinations.

          License posture: All Rights Reserved. No reuse license is granted by this release.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Frontier Mission Assurance v${VERSION}" --notes-file release-notes.md \
            "dist/frontier-mission-assurance-v${VERSION}.zip" \
            "dist/frontier_mission_assurance-${VERSION}-py3-none-any.whl" \
            "dist/FMA-v${VERSION}-SOURCE-SHA256SUMS" \
            "dist/FMA-v${VERSION}-SBOM.cdx.json" \
            "dist/FMA-v${VERSION}-SHA256SUMS"

          TAG_REF_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          TAG_REF_TYPE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type')"
          TAG_TARGET_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_REF_SHA" --jq '.object.sha')"
          [[ "$TAG_REF_TYPE" == "tag" ]]
          [[ "$TAG_TARGET_SHA" == "$RELEASE_SHA" ]]

  verify-published:
    name: Verify published stable release
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify published release as a clean user
        shell: bash
        run: |
          set -euo pipefail

          VERIFIED="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA" --jq '.commit.verification.verified and (.commit.verification.reason == "valid")')"
          [[ "$VERIFIED" == "true" ]]
          TAG_REF_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          TAG_REF_TYPE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type')"
          TAG_TARGET_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_REF_SHA" --jq '.object.sha')"
          [[ "$TAG_REF_TYPE" == "tag" ]]
          [[ "$TAG_TARGET_SHA" == "$RELEASE_SHA" ]]

          VERIFY="$RUNNER_TEMP/fma-release-verify"
          mkdir -p "$VERIFY"
          cd "$VERIFY"
          BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          SOURCE="frontier-mission-assurance-v${VERSION}.zip"
          WHEEL="frontier_mission_assurance-${VERSION}-py3-none-any.whl"
          SOURCE_SUMS="FMA-v${VERSION}-SOURCE-SHA256SUMS"
          SBOM="FMA-v${VERSION}-SBOM.cdx.json"
          SUMS="FMA-v${VERSION}-SHA256SUMS"
          for FILE in "$SOURCE" "$WHEEL" "$SOURCE_SUMS" "$SBOM" "$SUMS"; do
            curl -fsSL "$BASE/$FILE" -o "$FILE"
          done
          sha256sum -c "$SUMS"
          gh attestation verify "$WHEEL" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$SOURCE" --repo "$GITHUB_REPOSITORY"
          python -m venv .venv
          .venv/bin/python -m pip install "./$WHEEL" "jsonschema==4.26.0"
          [[ "$(.venv/bin/python -m frontier_assurance.cli --version)" == "fma ${VERSION}" ]]
          unzip -q "$SOURCE" -d source
          cd source/frontier-mission-assurance
          sha256sum -c "$VERIFY/$SOURCE_SUMS"
          "$VERIFY/.venv/bin/python" scripts/evaluate_public_reference.py
          "$VERIFY/.venv/bin/python" scripts/validate_profile_manifests.py .
          "$VERIFY/.venv/bin/fma" validate examples/external_research_adoption/graph.yaml
          "$VERIFY/.venv/bin/fma" decision examples/external_research_adoption/graph.yaml examples/external_research_adoption/decision-receipt.yaml
          "$VERIFY/.venv/bin/python" scripts/validate_scientific_discovery.py .
          "$VERIFY/.venv/bin/python" scripts/validate_orbital_recovery_assurance.py .
          "$VERIFY/.venv/bin/python" scripts/validate_ftqc_assurance.py .
          "$VERIFY/.venv/bin/python" scripts/evaluate_ftqc_reference.py .
          PYTHONPATH=src "$VERIFY/.venv/bin/python" scripts/validate_ftqc_case.py profiles/ftqc-assurance/examples/synthetic-neutral-atom/baseline --report build/ftqc-case-decision-basis.md
          PYTHONPATH=src "$VERIFY/.venv/bin/python" scripts/compare_ftqc_cases.py profiles/ftqc-assurance/examples/synthetic-neutral-atom/baseline profiles/ftqc-assurance/examples/synthetic-neutral-atom/changed-assumption-case --report build/ftqc-change-impact.md
          "$VERIFY/.venv/bin/fma" reproduce examples/research_receipt/receipt.yaml --timeout 30
          "$VERIFY/.venv/bin/fma" receipt examples/research_receipt_v3_external/receipt.yaml
          grep -Fq "CLAIM-CYCLE-TARGET" build/assurance-report.md
