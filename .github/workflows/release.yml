name: Stable Release

on:
  workflow_run:
    workflows: ["V&V CI"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: stable-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish stable release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve stable release identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          SHA="${{ github.event.workflow_run.head_sha }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "RELEASE_ELIGIBLE=0" >> "$GITHUB_ENV"
            exit 0
          fi
          TAG="v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "RELEASE_ELIGIBLE=0" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "RELEASE_ELIGIBLE=1" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Install bounded release toolchain
        if: env.RELEASE_ELIGIBLE == '1'
        run: >-
          python -m pip install
          "setuptools==80.9.0" "wheel==0.45.1" "build==1.6.1"
          "PyYAML==6.0.3" "jsonschema==4.26.0"

      - name: Reverify source boundary
        if: env.RELEASE_ELIGIBLE == '1'
        run: |
          python scripts/opsec_scan.py .
          PYTHONPATH=src python scripts/evaluate_public_reference.py
          python scripts/validate_scientific_discovery.py .

      - name: Build release artifacts and manifests
        if: env.RELEASE_ELIGIBLE == '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > "dist/FMA-v${VERSION}-SOURCE-SHA256SUMS"
          git archive --format=zip --prefix=frontier-mission-assurance/ \
            -o "dist/frontier-mission-assurance-v${VERSION}.zip" "$RELEASE_SHA"
          python -m build --wheel --no-isolation
          (
            cd dist
            sha256sum \
              "frontier-mission-assurance-v${VERSION}.zip" \
              "frontier_mission_assurance-${VERSION}-py3-none-any.whl" \
              "FMA-v${VERSION}-SOURCE-SHA256SUMS" \
              > "FMA-v${VERSION}-SHA256SUMS"
          )

      - name: Publish GitHub Release
        if: env.RELEASE_ELIGIBLE == '1'
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Frontier Mission Assurance v${VERSION} is a stable public reference release for evidence-native verification, validation, reproducibility, traceability, and human-owned decision basis.

          This release was published automatically only after the exact main commit passed the complete hosted V&V workflow. See CHANGELOG.md for material changes.

          V&V run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ github.event.workflow_run.id }}
          Commit: ${RELEASE_SHA}

          A PASS proves only the declared mechanics. It does not establish scientific truth, regulatory compliance, supplier qualification, mission readiness, legal priority, research-boundary enforcement, or authorization for consequential decisions.

          License posture: All Rights Reserved. No reuse license is granted by this release.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
            --title "Frontier Mission Assurance v${VERSION}" --notes-file release-notes.md \
            "dist/frontier-mission-assurance-v${VERSION}.zip" \
            "dist/frontier_mission_assurance-${VERSION}-py3-none-any.whl" \
            "dist/FMA-v${VERSION}-SOURCE-SHA256SUMS" \
            "dist/FMA-v${VERSION}-SHA256SUMS"
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          [[ "$TAG_SHA" == "$RELEASE_SHA" ]]

      - name: Public release clean-user UAT
        if: env.RELEASE_ELIGIBLE == '1'
        shell: bash
        run: |
          set -euo pipefail
          UAT="$RUNNER_TEMP/fma-release-uat"
          mkdir -p "$UAT"
          cd "$UAT"
          BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          SOURCE="frontier-mission-assurance-v${VERSION}.zip"
          WHEEL="frontier_mission_assurance-${VERSION}-py3-none-any.whl"
          SOURCE_SUMS="FMA-v${VERSION}-SOURCE-SHA256SUMS"
          SUMS="FMA-v${VERSION}-SHA256SUMS"
          for FILE in "$SOURCE" "$WHEEL" "$SOURCE_SUMS" "$SUMS"; do
            curl -fsSL "$BASE/$FILE" -o "$FILE"
          done
          sha256sum -c "$SUMS"
          python -m venv .venv
          .venv/bin/python -m pip install "./$WHEEL" "jsonschema==4.26.0"
          [[ "$(.venv/bin/python -m frontier_assurance.cli --version)" == "fma ${VERSION}" ]]
          unzip -q "$SOURCE" -d source
          cd source/frontier-mission-assurance
          sha256sum -c "$UAT/$SOURCE_SUMS"
          "$UAT/.venv/bin/python" scripts/evaluate_public_reference.py
          "$UAT/.venv/bin/python" scripts/validate_scientific_discovery.py .
          grep -Fq "CLAIM-CYCLE-TARGET" build/assurance-report.md
