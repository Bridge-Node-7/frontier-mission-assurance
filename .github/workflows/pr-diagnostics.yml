name: PR diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostics:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - name: Capture lint and test diagnostics
        shell: bash
        run: |
          mkdir -p build/diagnostics
          set +e
          ruff check src tests scripts > build/diagnostics/ruff.txt 2>&1
          echo "$?" > build/diagnostics/ruff.exit
          pytest -q > build/diagnostics/pytest.txt 2>&1
          echo "$?" > build/diagnostics/pytest.exit
          set -e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-diagnostics
          path: build/diagnostics
          if-no-files-found: error
          retention-days: 1
