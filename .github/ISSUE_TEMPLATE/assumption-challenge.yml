name: Assumption challenge
description: Challenge an active assumption with new evidence or reasoning
body:
- type: markdown
  attributes:
    value: Use public or synthetic information only. Report vulnerabilities privately through SECURITY.md.
- type: input
  id: assumption
  attributes:
    label: Assumption ID
  validations:
    required: true
- type: textarea
  id: challenge
  attributes:
    label: Challenge
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Contradicting or qualifying evidence
- type: textarea
  id: impact
  attributes:
    label: Affected public claim or example
- type: checkboxes
  id: public_safe
  attributes:
    label: Public information
    options:
    - label: I confirm this submission contains only public-safe or synthetic information.
      required: true
  validations:
    required: true
