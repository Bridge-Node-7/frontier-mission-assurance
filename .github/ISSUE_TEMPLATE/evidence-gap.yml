name: Evidence gap
description: Record a claim or assumption that lacks sufficient evidence
body:
- type: markdown
  attributes:
    value: Use public or synthetic information only. Report vulnerabilities privately through SECURITY.md.
- type: input
  id: node
  attributes:
    label: Claim / assumption ID
  validations:
    required: true
- type: textarea
  id: gap
  attributes:
    label: What is not yet supported?
  validations:
    required: true
- type: textarea
  id: consequence
  attributes:
    label: Affected public behavior
  validations:
    required: true
- type: textarea
  id: closure
  attributes:
    label: Minimum evidence needed to close the gap
  validations:
    required: true
- type: checkboxes
  id: public_safe
  attributes:
    label: Public information
    options:
    - label: I confirm this submission contains only public-safe or synthetic information.
      required: true
  validations:
    required: true
