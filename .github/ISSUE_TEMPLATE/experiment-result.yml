name: Experiment result
description: Record a result that verifies, validates, or contradicts an assurance
  node
body:
- type: markdown
  attributes:
    value: Use public or synthetic information only. Report vulnerabilities privately through SECURITY.md.
- type: input
  id: experiment
  attributes:
    label: Experiment ID
  validations:
    required: true
- type: input
  id: target
  attributes:
    label: Claim / assumption being tested
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Declared acceptance criterion
  validations:
    required: true
- type: textarea
  id: result
  attributes:
    label: Result and public evidence reference
  validations:
    required: true
- type: dropdown
  id: verdict
  attributes:
    label: Verdict
    options:
    - PASS
    - FAIL
    - INCONCLUSIVE
  validations:
    required: true
- type: checkboxes
  id: public_safe
  attributes:
    label: Public information
    options:
    - label: I confirm this submission contains only public-safe or synthetic information.
      required: true
  validations:
    required: true
