name: Public reference bug / reproducibility report
description: Report a public-safe defect or reproducibility problem
body:
  - type: markdown
    attributes:
      value: >-
        Use public or synthetic information only. Report vulnerabilities privately through SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe the smallest public-safe reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FMA version
      placeholder: Version or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Other / not applicable
    validations:
      required: true
  - type: checkboxes
    id: public_safe
    attributes:
      label: Public information
      options:
        - label: I confirm this submission contains only public-safe or synthetic information.
          required: true
    validations:
      required: true
