[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-mission-assurance"
version = "0.4.0"
description = "Public reference implementation for evidence-native verification, validation, and mission assurance"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{name = "Bridge Node 7"}]
dependencies = ["PyYAML>=6.0"]
keywords = ["verification", "validation", "mission-assurance", "reproducibility", "systems-engineering", "evidence"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10", "ruff>=0.6", "jsonschema>=4.23", "build>=1.2"]

[project.scripts]
fma = "frontier_assurance.cli:main"

[project.urls]
Homepage = "https://bridgenode7.com/"
Repository = "https://github.com/Bridge-Node-7/frontier-mission-assurance"
Issues = "https://github.com/Bridge-Node-7/frontier-mission-assurance/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
